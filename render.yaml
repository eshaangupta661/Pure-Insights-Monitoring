services:
  - type: web
    name: pure-insights-command-center
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build && npm run ingest
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '24'
      - key: JWT_SECRET
        generateValue: true
