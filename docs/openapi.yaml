      type: object
      properties:
        tick:
          type: integer
        cycle:
          type: integer
        snapshotDate:
          type: string
          format: date
          example: 2026-10-10
        paused:
          type: boolean
        speed:
          type: number
        speeds:
          type: array
          items:
            type: number
        tickMs:
          type: integer
      required:
        - tick
        - cycle
        - snapshotDate
        - paused
        - speed
        - speeds
        - tickMs
    ReplayCommand:
      oneOf:
        - type: object
          properties:
            action:
              type: string
              enum:
                - pause
          required:
            - action
        - type: object
          properties:
            action:
              type: string
              enum:
                - resume
          required:
            - action
        - type: object
          properties:
            action:
              type: string
              enum:
                - speed
            value:
              type: number
              enum:
                - 1
                - 2
                - 5
                - 10
          required:
            - action
            - value
      example:
        action: speed
        value: 5
    IncidentRequest:
      type: object
      properties:
        reportId:
          type: string
          pattern: ^RPT_\d+$
        kind:
          type: string
          enum:
            - LATENCY_SPIKE
            - REFRESH_FAILED
      required:
        - reportId
        - kind
      example:
        reportId: RPT_203
        kind: LATENCY_SPIKE
    AuditAction:
      type: string
      enum:
        - OWNER_OVERRIDE
        - ALERT_ACK
        - REPLAY_CONTROL
        - INCIDENT_INJECT
    AuditLogEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        at:
          type: string
          format: date-time
        actorEmail:
          type: string
        action:
          $ref: "#/components/schemas/AuditAction"
        target:
          type: string
        details:
          type: object
          additionalProperties:
            nullable: true
      required:
        - id
        - at
        - actorEmail
        - action
        - target
        - details
  parameters: {}
paths:
  /health:
    get:
      tags:
        - health
      summary: Liveness probe (Render health check); no auth
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/auth/login:
    post:
      tags:
        - auth
      summary: Sign in
      description: |-
        Public.

        Limited to 20 attempts per client IP per 60 s (429 RATE_LIMITED). Checks the email (trimmed, case-insensitive) and password. On success, sets the `pic_token` httpOnly session cookie. The token is never returned in the body.
      security: []
      x-roles: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: "VALIDATION_ERROR: invalid query, path or body"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: "BAD_ORIGIN: cross-origin mutation (production)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: "RATE_LIMITED: too many sign-in attempts from this IP"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/logout:
    post:
      tags:
        - auth
      summary: Sign out
      description: |-
        Public.

        Clears the session cookie. Tokens are stateless JWTs, so a copied token stays valid until it expires.
      security: []
      x-roles: []
      responses:
        "204":
          description: No content
        "403":
          description: "BAD_ORIGIN: cross-origin mutation (production)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/me:
    get:
      tags:
        - auth
      summary: The signed-in user
      description: "Roles: admin, owner, viewer."
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-roles:
        - admin
        - owner
        - viewer
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: "UNAUTHENTICATED: no valid session"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/overview:
    get:
      tags:
        - reports
      summary: KPIs for the current replay snapshot
      description: |-
        Roles: admin, owner, viewer.

        Owners see only reports whose current owner is their email (filtered in SQL). Viewers get the same rows without cost fields. `totals` are aggregates, so every role sees them. `alerts` counts active (OPEN + ACKNOWLEDGED) alerts in scope.
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-roles:
        - admin
        - owner
        - viewer
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverviewKpis"
        "401":
          description: "UNAUTHENTICATED: no valid session"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/overview/trend:
    get:
      tags:
        - reports
      summary: Refresh-status trend and load-time histogram
      description: |-
        Roles: admin, owner, viewer.

        Owners see only reports whose current owner is their email (filtered in SQL). Viewers get the same rows without cost fields. `points` has one entry per snapshot (all of them, so the client can show where the replay is); `latency` is the load-time histogram of the current snapshot.
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-roles:
        - admin
        - owner
        - viewer
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverviewTrend"
        "401":
          description: "UNAUTHENTICATED: no valid session"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/reports:
    get:
      tags:
        - reports
      summary: Reports at the current replay snapshot
      description: |-
        Roles: admin, owner, viewer.

        Owners see only reports whose current owner is their email (filtered in SQL). Viewers get the same rows without cost fields. Sorted by `sort`/`order`, then report id.
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-roles:
        - admin
        - owner
        - viewer
      parameters:
        - schema:
            type: integer
            minimum: 1
            default: 1
            description: 1-based page number
          required: false
          name: page
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
            description: Items per page (max 100)
          required: false
          name: pageSize
          in: query
        - schema:
            type: string
            maxLength: 100
            description: Case-insensitive substring of report id, name or current owner
          required: false
          name: q
          in: query
        - schema:
            $ref: "#/components/schemas/RefreshStatus"
          required: false
          name: status
          in: query
        - schema:
            type: string
            enum: &a1
              - "true"
              - "false"
            description: true = current owner is NULL
          required: false
          name: orphaned
          in: query
        - schema:
            type: string
            enum: *a1
            description: true = load time > 15s at this snapshot
          required: false
          name: slow
          in: query
        - schema:
            type: string
            enum:
              - reportId
              - loadTime
              - views
              - status
            default: reportId
          required: false
          name: sort
          in: query
        - schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
          required: false
          name: order
          in: query
      responses:
        "200":
          description: Success. Viewers receive the cost-free variant (second schema).
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/ReportSummary"
                      page:
                        type: integer
                      pageSize:
                        type: integer
                      total:
                        type: integer
                    required:
                      - items
                      - page
                      - pageSize
                      - total
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/ViewerReportSummary"
                      page:
                        type: integer
                      pageSize:
                        type: integer
                      total:
                        type: integer
                    required:
                      - items
                      - page
                      - pageSize
                      - total
        "400":
          description: "VALIDATION_ERROR: invalid query, path or body"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: "UNAUTHENTICATED: no valid session"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/reports/{id}:
    get:
      tags:
        - reports
      summary: "One report: 20-snapshot history, owner history, DQ flags, cost"
      description: |-
        Roles: admin, owner, viewer.

        Owners see only reports whose current owner is their email (filtered in SQL). Viewers get the same rows without cost fields. A report outside the caller's scope is 404, not 403, so its existence isn't revealed.
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-roles:
        - admin
        - owner
        - viewer
      parameters:
        - schema:
            type: string
            pattern: ^RPT_\d+$
            example: RPT_203
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Success. Viewers receive the cost-free variant (second schema).
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/ReportDetail"
                  - $ref: "#/components/schemas/ViewerReportDetail"
        "400":
          description: "VALIDATION_ERROR: invalid query, path or body"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: "UNAUTHENTICATED: no valid session"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such report in your scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/reports/{id}/owner:
    patch:
      tags:
        - reports
      summary: Reassign a report’s owner (admin)
      description: |-
        Roles: admin.

        Writes OWNER_OVERRIDES and an AUDIT_LOG row in one transaction. `ownerEmail: null` marks the report orphaned. Ownership-dependent views (current-owner chargeback, zombies, owner scoping, the report’s alerts) follow immediately; ingest-time results are unchanged.
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-roles:
        - admin
      parameters:
        - schema:
            type: string
            pattern: ^RPT_\d+$
            example: RPT_203
          required: true
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerOverrideRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDetail"
        "400":
          description: "VALIDATION_ERROR: invalid query, path or body"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: "UNAUTHENTICATED: no valid session"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: "FORBIDDEN: role not allowed; BAD_ORIGIN: cross-origin mutation (production)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Unknown report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/data-quality:
    get:
      tags:
        - data-quality
      summary: DQ rule results
      description: |-
        Roles: admin, owner, viewer.

        Counts over every snapshot of the reports in scope (all 100 reports unless the caller is an owner). `checks` is the SQL-vs-TypeScript verification from /sql/02.
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-roles:
        - admin
        - owner
        - viewer
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataQualityResponse"
        "401":
          description: "UNAUTHENTICATED: no valid session"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/costs/reports:
    get:
      tags:
        - costs
      summary: Attributed Snowflake cost per report (/sql/04)
      description: |-
        Roles: admin, owner, viewer.

        Owners see only their reports (filtered in SQL); shares are over the rows in the caller’s scope. Viewers get rows without money or credits, plus the `totals` aggregates, and may not sort by cost (403). Unscoped callers also get the always-present UNATTRIBUTED line.
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-roles:
        - admin
        - owner
        - viewer
      parameters:
        - schema:
            type: integer
            minimum: 1
            default: 1
            description: 1-based page number
          required: false
          name: page
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
            description: Items per page (max 100)
          required: false
          name: pageSize
          in: query
        - schema:
            type: string
            enum:
              - cost
              - queries
              - reportId
            description: "Default `cost` (desc); viewers: `reportId`, and cost sorts are 403"
          required: false
          name: sort
          in: query
        - schema:
            type: string
            enum: &a2
              - asc
              - desc
            description: Default depends on `sort`
          required: false
          name: order
          in: query
      responses:
        "200":
          description: Success. Viewers receive the cost-free variant (second schema).
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/CostRow"
                      page:
                        type: integer
                      pageSize:
                        type: integer
                      total:
                        type: integer
                      totals:
                        $ref: "#/components/schemas/CostReportsTotals"
                    required:
                      - items
                      - page
                      - pageSize
                      - total
                      - totals
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/ViewerCostRow"
                      page:
                        type: integer
                      pageSize:
                        type: integer
                      total:
                        type: integer
                      totals:
                        $ref: "#/components/schemas/CostReportsTotals"
                    required:
                      - items
                      - page
                      - pageSize
                      - total
                      - totals
        "400":
          description: "VALIDATION_ERROR: invalid query, path or body"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: "UNAUTHENTICATED: no valid session"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: "FORBIDDEN: a viewer asked for a cost sort"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/costs/unit-economics:
    get:
      tags:
        - costs
      summary: Cost per active view per report, Snowflake-only and fully loaded (/sql/05)
      description: |-
        Roles: admin, owner, viewer.

        Owners see only their reports (filtered in SQL); shares are over the rows in the caller’s scope. Viewers get rows without money or credits, plus the `totals` aggregates, and may not sort by cost (403). Zero-view and quarantined snapshots have NULL unit cost.
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-roles:
        - admin
        - owner
        - viewer
      parameters:
        - schema:
            type: integer
            minimum: 1
            default: 1
            description: 1-based page number
          required: false
          name: page
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
            description: Items per page (max 100)
          required: false
          name: pageSize
          in: query
        - schema:
            type: string
            enum:
              - costPerView
              - reportId
            description: "Default `costPerView` (desc, nulls last); viewers: `reportId`"
          required: false
          name: sort
          in: query
        - schema:
            type: string
            enum: *a2
            description: Default depends on `sort`
          required: false
          name: order
          in: query
      responses:
        "200":
          description: Success. Viewers receive the cost-free variant (second schema).
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/UnitEconomicsRow"
                      page:
                        type: integer
                      pageSize:
                        type: integer
                      total:
                        type: integer
                      totals:
                        $ref: "#/components/schemas/UnitEconomicsTotals"
                    required:
                      - items
                      - page
                      - pageSize
                      - total
                      - totals
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/ViewerUnitEconomicsRow"
                      page:
                        type: integer
                      pageSize:
                        type: integer
                      total:
                        type: integer
                      totals:
                        $ref: "#/components/schemas/UnitEconomicsTotals"
                    required:
                      - items
                      - page
                      - pageSize
                      - total
                      - totals
        "400":
          description: "VALIDATION_ERROR: invalid query, path or body"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: "UNAUTHENTICATED: no valid session"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: "FORBIDDEN: a viewer asked for a cost sort"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/costs/anomalies:
    get:
      tags:
        - costs
      summary: Cost anomalies (/sql/06)
      description: |-
        Roles: admin, owner, viewer.

        Owners see only their reports (filtered in SQL); shares are over the rows in the caller’s scope. Viewers get rows without money or credits, plus the `totals` aggregates, and may not sort by cost (403). Four short, bounded sections (not paginated): per-view cost outliers, zombie reports (live: follows owner overrides), AWS-vs-views mismatches (DQ04) and quarantined negative-credit snapshots (DQ02). Admins and owners get each section most severe first; viewers get them by report and snapshot, without z-scores, since the order or a z-score would reveal per-report cost ranks.
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-roles:
        - admin
        - owner
        - viewer
      responses:
        "200":
          description: Success. Viewers receive the cost-free variant (second schema).
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/AnomalyReport"
                  - $ref: "#/components/schemas/ViewerAnomalyReport"
        "401":
          description: "UNAUTHENTICATED: no valid session"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/costs/chargeback:
    get:
      tags:
        - costs
      summary: Cost per owner (/sql/07)
      description: |-
        Roles: admin, owner, viewer.

        `view=point_in_time` charges each snapshot to that snapshot’s owner; `view=current` charges a report’s whole history to its current owner (live: follows overrides). point_in_time is an accounting view for admins (viewers get its redacted counts); owners get only `current` (their default), and `view=point_in_time` is 403 for them, because their past-snapshot charges include reports they no longer own. Owners see only their own line; unscoped callers also get UNOWNED and UNATTRIBUTED. Viewers get report and snapshot counts per owner, plus totals.
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-roles:
        - admin
        - owner
        - viewer
      parameters:
        - schema:
            type: integer
            minimum: 1
            default: 1
            description: 1-based page number
          required: false
          name: page
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
            description: Items per page (max 100)
          required: false
          name: pageSize
          in: query
        - schema:
            $ref: "#/components/schemas/ChargebackView"
          required: false
          name: view
          in: query
        - schema:
            type: string
            enum:
              - cost
              - owner
            description: "Default `cost` (desc); viewers: `owner`"
          required: false
          name: sort
          in: query
        - schema:
            type: string
            enum: *a2
            description: Default depends on `sort`
          required: false
          name: order
          in: query
      responses:
        "200":
          description: Success. Viewers receive the cost-free variant (second schema).
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/ChargebackRow"
                      page:
                        type: integer
                      pageSize:
                        type: integer
                      total:
                        type: integer
                      totals:
                        $ref: "#/components/schemas/ChargebackTotals"
                    required:
                      - items
                      - page
                      - pageSize
                      - total
                      - totals
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/ViewerChargebackRow"
                      page:
                        type: integer
                      pageSize:
                        type: integer
                      total:
                        type: integer
                      totals:
                        $ref: "#/components/schemas/ChargebackTotals"
                    required:
                      - items
                      - page
                      - pageSize
                      - total
                      - totals
        "400":
          description: "VALIDATION_ERROR: invalid query, path or body"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: "UNAUTHENTICATED: no valid session"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: "FORBIDDEN: a viewer asked for a cost sort, or an owner asked for view=point_in_time"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/alerts:
    get:
      tags:
        - alerts
      summary: Alerts of the current replay cycle
      description: |-
        Roles: admin, owner, viewer.

        Active first (OPEN, ACKNOWLEDGED, RESOLVED), then most severe, then most recently seen. Owners see alerts for reports they currently own; admins and viewers see all. Alerts are kept in memory and rebuilt from the snapshots, so they reset when the replay wraps to snapshot 0.
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-roles:
        - admin
        - owner
        - viewer
      parameters:
        - schema:
            type: integer
            minimum: 1
            default: 1
            description: 1-based page number
          required: false
          name: page
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
            description: Items per page (max 100)
          required: false
          name: pageSize
          in: query
        - schema:
            $ref: "#/components/schemas/AlertStatus"
          required: false
          name: status
          in: query
        - schema:
            $ref: "#/components/schemas/Severity"
          required: false
          name: severity
          in: query
      responses:
        "200":
          description: Success. Viewers receive the cost-free variant (second schema).
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Alert"
                      page:
                        type: integer
                      pageSize:
                        type: integer
                      total:
                        type: integer
                    required:
                      - items
                      - page
                      - pageSize
                      - total
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Alert"
                      page:
                        type: integer
                      pageSize:
                        type: integer
                      total:
                        type: integer
                    required:
                      - items
                      - page
                      - pageSize
                      - total
        "400":
          description: "VALIDATION_ERROR: invalid query, path or body"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: "UNAUTHENTICATED: no valid session"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/alerts/{id}/ack:
    post:
      tags:
        - alerts
      summary: Acknowledge an alert
      description: |-
        Roles: admin, owner.

        OPEN → ACKNOWLEDGED (idempotent if already acknowledged). Owners may ack only alerts on their own reports; others are 404. Audit-logged, then broadcast as `alert:updated`.
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-roles:
        - admin
        - owner
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 120
            example: 88990-RPT_203-LATENCY-7
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
        "400":
          description: "VALIDATION_ERROR: invalid query, path or body"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: "UNAUTHENTICATED: no valid session"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: "FORBIDDEN: role not allowed; BAD_ORIGIN: cross-origin mutation (production)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such alert in your scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The alert is already RESOLVED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/admin/replay:
    get:
      tags:
        - admin
      summary: Replay state (admin)
      description: "Roles: admin."
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-roles:
        - admin
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayState"
        "401":
          description: "UNAUTHENTICATED: no valid session"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: "FORBIDDEN: role not allowed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      tags:
        - admin
      summary: Pause, resume or change the replay speed (admin)
      description: |-
        Roles: admin.

        Moves only the clock’s time anchor, so the tick never jumps and nothing is counted. In memory: a restart resumes at speed 1 from wall time. Audit-logged; broadcasts `tick`.
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-roles:
        - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplayCommand"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayState"
        "400":
          description: "VALIDATION_ERROR: invalid query, path or body"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: "UNAUTHENTICATED: no valid session"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: "FORBIDDEN: role not allowed; BAD_ORIGIN: cross-origin mutation (production)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/admin/incidents:
    post:
      tags:
        - admin
      summary: Inject a synthetic incident at the current tick (admin)
      description: |-
        Roles: admin.

        LATENCY_SPIKE sets the report’s load time to INCIDENT_LATENCY_SEC (CRITICAL); REFRESH_FAILED sets its refresh status to FAILED. The resulting alert has `synthetic: true` and bypasses the reopen cooldown. Kept in memory for the current replay cycle and broadcast to WebSocket clients as soon as it is audited (not deferred to the next tick). Repeating an identical incident at the same tick is a no-op; at most 200 distinct incidents per cycle. Audit-logged.
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-roles:
        - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentRequest"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
        "400":
          description: "VALIDATION_ERROR: invalid query, path or body"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: "UNAUTHENTICATED: no valid session"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: "FORBIDDEN: role not allowed; BAD_ORIGIN: cross-origin mutation (production)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Unknown report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: "RATE_LIMITED: more than 200 incidents in this replay cycle"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/admin/audit-log:
    get:
      tags:
        - admin
      summary: Audit log, newest first (admin)
      description: |-
        Roles: admin.

        Owner overrides, alert acks, replay controls and injected incidents. Stored in the warehouse, so re-running ingest (or a redeploy) clears it.
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-roles:
        - admin
      parameters:
        - schema:
            type: integer
            minimum: 1
            default: 1
            description: 1-based page number
          required: false
          name: page
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
            description: Items per page (max 100)
          required: false
          name: pageSize
          in: query
        - schema:
            $ref: "#/components/schemas/AuditAction"
          required: false
          name: action
          in: query
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditLogEntry"
                  page:
                    type: integer
                  pageSize:
                    type: integer
                  total:
                    type: integer
                required:
                  - items
                  - page
                  - pageSize
                  - total
        "400":
          description: "VALIDATION_ERROR: invalid query, path or body"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: "UNAUTHENTICATED: no valid session"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: "FORBIDDEN: role not allowed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
